          description: Liste paginée des jeux de données.
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dataset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/datasets/{slug}:
    get:
      tags: [Catalogue]
      summary: Détail d'un jeu de données par slug
      description: Renvoie le détail d'un jeu de données et sa dernière version publiée.
      operationId: showDataset
      security: []
      parameters:
        - $ref: '#/components/parameters/SlugPath'
      responses:
        '200':
          description: Détail du jeu de données.
          content:
            application/json:
              schema:
                type: object
