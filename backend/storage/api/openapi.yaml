  /api/v1/admin/audit/summary:
    get:
      tags: [Administration]
      summary: Synthèse d'audit (RBAC §55)
      description: |
        Exemple de ressource administrée. Exige une clé API **active** portant la
        permission `administer`. Une clé publique/développeur reçoit **403**
        (INSUFFICIENT_PERMISSIONS) ; l'absence de clé reçoit **401**
        (API_KEY_MISSING) — jamais un accès partiel (CDC §55).
      operationId: getAdminAuditSummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Synthèse d'audit autorisée.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      audit_events_total:
                        type: integer
                      granted_by_permission:
                        type: string
                        example: administer
        '403':
          description: Clé active mais dépourvue de la permission `administer`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: INSUFFICIENT_PERMISSIONS
                  message: "Permission « administer » manquante pour cette ressource."
                  request_id: 6f1d4a2e-9a44-4f1f-9f70-2c2b6a1b7f10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

