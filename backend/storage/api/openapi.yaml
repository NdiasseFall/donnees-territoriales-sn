      description: |
        Indique si l'application et la base PostgreSQL/PostGIS sont opérationnelles.
        Route publique, utilisée par les sondes de déploiement (CDC §63).
      operationId: getHealth
      security: []
      responses:
        '200':
          description: État de santé (healthy ou degraded).
          headers:
