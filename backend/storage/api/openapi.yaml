      tags: [Authentification]
      summary: Lister les clés API de l'utilisateur
      description: Renvoie les clés API appartenant à l'utilisateur authentifié (secret masqué).
      operationId: listApiKeys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des clés API.
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
