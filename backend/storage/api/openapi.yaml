  /api/v1/spatial/intersect:
    post:
      tags: [Spatial]
      summary: Intersection avec une géométrie utilisateur
      description: |
        Renvoie les territoires intersectant la géométrie fournie (Polygon,
        LineString ou Point, en GeoJSON ou WKT), via `ST_Intersects`. Avec
        `format=geojson`, renvoie une FeatureCollection RFC 7946.
      operationId: queryIntersect
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geometry]
              properties:
                geometry:
                  description: Géométrie GeoJSON (objet) ou WKT (chaîne).
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: string
                      example: POLYGON((-17.6 14.6, -17.0 14.6, -17.0 15.0, -17.6 15.0, -17.6 14.6))
                level:
                  $ref: '#/components/schemas/HierarchyLevel'
                limit:
                  type: integer
                  minimum: 1
                  maximum: 200
                format:
                  type: string
                  enum: [json, geojson]
      responses:
        '200':
          description: Territoires intersectants (JSON) ou FeatureCollection (GeoJSON).
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Territory'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/GeoJsonFeatureCollection'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/search:
    get:
      tags: [Recherche]
      summary: Recherche plein texte de territoires
      description: |
        Recherche de territoires par nom, code ou ville (plein texte + trigrammes,
        insensible à la casse et aux accents). Renvoie une liste plate classée par
        pertinence, avec filtres optionnels sur le niveau et le parent (US-012).
      operationId: searchTerritories
      security: []
      parameters:
        - $ref: '#/components/parameters/SearchTermQuery'
        - $ref: '#/components/parameters/LevelQuery'
        - $ref: '#/components/parameters/ParentCodeQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Résultats de recherche classés par pertinence.
          content:
            application/json:
              schema:
                type: object
                required: [success, query, count, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  query:
                    type: string
                    example: Mbour
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Territory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
