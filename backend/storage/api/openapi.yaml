          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Authentification]
      summary: Créer une clé API
      description: |
        Crée une clé API pour l'utilisateur authentifié. Le jeton en clair n'est
        renvoyé qu'une seule fois, à la création (CDC §53).
      operationId: createApiKey
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name:
                  type: string
                  maxLength: 255
                permissions:
                  type: array
                  items:
                    type: string
                tier:
                  type: string
                  enum: [public, developer, admin]
                  default: public
                description:
                  type: string
                  maxLength: 500
                expires_at:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Clé API créée ; le jeton en clair est renvoyé une seule fois.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ApiKey'
        '401':
