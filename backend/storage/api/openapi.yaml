  /api/v1/spatial/reverse-geocode:
    get:
      tags: [Spatial]
      summary: Géocodage inverse (coordonnées → hiérarchie territoriale)
      description: |
        À partir d'un point WGS84 (EPSG:4326), renvoie la hiérarchie territoriale
        complète (pays → région → département → arrondissement → commune → …)
        via `ST_Within`. Un point **hors emprise** (ou dans l'océan) renvoie un
        `404` explicite — jamais une commune arbitraire. Chaque résultat porte un
        **indicateur de confiance** (`high`/`medium`/`low`) dérivé de la distance
        à la frontière du territoire le plus fin : un point proche d'une limite
        est intrinsèquement ambigu. Coordonnées : `lng` (alias `lon`) et `lat`
        (CDC §44).
      operationId: reverseGeocode
      security: []
      parameters:
        - $ref: '#/components/parameters/LongitudeQuery'
        - $ref: '#/components/parameters/LatitudeQuery'
        - $ref: '#/components/parameters/LevelQuery'
      responses:
        '200':
          description: Hiérarchie territoriale résolue pour le point donné.
          content:
            application/json:
              schema:
                type: object
                required: [success, query, confidence, hierarchy]
                properties:
                  success:
                    type: boolean
                    example: true
                  query:
                    type: object
                    properties:
                      longitude:
                        type: number
                      latitude:
                        type: number
                  confidence:
                    type: [string, "null"]
                    enum: [high, medium, low]
                    description: |
                      Indicateur de confiance (tolérance de frontière) :
                      `high` ≥ 1000 m d'une frontière, `medium` 100–1000 m,
                      `low` < 100 m (point proche d'une limite).
                  boundary_distance_m:
                    type: [number, "null"]
                    description: Distance (mètres) du point à la frontière du territoire le plus fin contenant.
                    example: 26919
                  hierarchy:
                    $ref: '#/components/schemas/ReverseGeocodeHierarchy'
              example:
                success: true
                query:
                  longitude: -16.25
                  latitude: 14.75
                confidence: high
                boundary_distance_m: 26919
                hierarchy:
                  country: { code: SN, name: Sénégal }
                  region: { code: SN-TH, name: Thiès }
                  department: { code: SN-TH-MB, name: Mbour }
                  commune: { code: SN-TH-MB-MBR, name: Mbour }
        '404':
          description: |
            Aucun territoire ne couvre le point (hors emprise ou dans l'océan).
            Enveloppe d'erreur §50 avec le code `REVERSE_GEOCODE_OUTSIDE_TERRITORY`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: REVERSE_GEOCODE_OUTSIDE_TERRITORY
                  message: "Aucun territoire ne couvre le point (-25, 10)."
                  request_id: 6f1d4a2e-9a44-4f1f-9f70-2c2b6a1b7f10
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/spatial/bbox:
    get:
      tags: [Spatial]
      summary: Recherche spatiale par emprise (BBOX)
      description: |
        Renvoie les territoires intersectant l'emprise `bbox` fournie
        (`min_lon,min_lat,max_lon,max_lat` en WGS84), via `ST_Intersects` en
        requête préparée. Avec `format=geojson`, renvoie une FeatureCollection
